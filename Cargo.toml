[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/gui/src-tauri",
    "crates/ui",
]
resolver = "2"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"
